(function(){
  var w = window.innerWidth || document.documentElement.clientWidth || 1024;
  var coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  window.DEVICE_MODE = (w < 700 || (coarse && w < 900)) ? 'phone' : 'pc';
  window.STORAGE_TARGET = 'ledger.v3';
  if (document.body) document.body.className = window.DEVICE_MODE === 'phone' ? 'device-phone' : 'device-pc';
  var timer;
  window.addEventListener('resize', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var next = (window.innerWidth < 700) ? 'phone' : 'pc';
      if (next === window.DEVICE_MODE) return;
      window.DEVICE_MODE = next;
      if (document.body) document.body.className = next === 'phone' ? 'device-phone' : 'device-pc';
      try { if (typeof render === 'function') render(); } catch(e){}
    }, 260);
  });
})();
</script>

<script>
/* ==========================================================================
   生活账本 2.0 · 云端同步层（Supabase）
   作用：替换原 HTML 的浏览器本地存储，改为云端 Postgres 存储 + 实时同步。
   设计：不侵入业务逻辑，只提供 loadDB / commitDB / restoreSeededLedger 需要的底层能力。
   ========================================================================== */
(function () {
  'use strict';

  var LS_CFG = 'ledger2.cfg';
  var T_RECORDS = 'ledger_records';
  var T_META = 'ledger_meta';

  var Cloud = {
    client: null,
    uid: null,
    email: '',
    cfg: null,
    rows: new Map(),      // ledger_id -> row {ledger_id,data,deleted_at,rev,updated_at}
    meta: {},             // 账本元信息（除 records 外的全部顶层字段）
    channel: null,
    readyPromise: null,
    status: 'init',       // init | connecting | ready | error
    lastError: '',
    lastSyncAt: null,
    _subscribed: false
  };
  window.Cloud = Cloud;

  /* ---------------- 配置读写 ---------------- */

  Cloud.loadCfg = function () {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_CFG) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.url && saved.key) return saved;
    // 文件里预置的默认配置（可选）：填了以后每台设备打开都不用再手输
    var def = window.__LEDGER_CLOUD_DEFAULT__;
    if (def && def.url && def.key) return { url: def.url, key: def.key };
    return saved;
  };
  Cloud.saveCfg = function (cfg) { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); };
  Cloud.clearCfg = function () { localStorage.removeItem(LS_CFG); };

  /* 记住上次登录的邮箱（只存邮箱，绝不存密码） */
  var LS_EMAIL = 'ledger2.lastEmail';
  Cloud.lastEmail = function () {
    try { return localStorage.getItem(LS_EMAIL) || ''; } catch (e) { return ''; }
  };
  Cloud.saveLastEmail = function (email) {
    try { if (email) localStorage.setItem(LS_EMAIL, email); } catch (e) {}
  };

  /* ---------------- 客户端初始化 ---------------- */

  Cloud.init = async function () {
    if (Cloud.client) return true;
    var cfg = Cloud.loadCfg();
    if (!cfg || !cfg.url || !cfg.key) return false;
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Supabase SDK 未加载，请检查文件是否完整');
    }
    Cloud.cfg = cfg;
    Cloud.client = window.supabase.createClient(cfg.url, cfg.key, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'ledger2.auth'
      }
    });
    var res = await Cloud.client.auth.getSession();
    var session = res && res.data ? res.data.session : null;
    Cloud.setSession(session);
    Cloud.client.auth.onAuthStateChange(function (_evt, s) {
      Cloud.setSession(s);
    });
    return true;
  };

  Cloud.setSession = function (session) {
    Cloud.uid = session && session.user ? session.user.id : null;
    Cloud.email = session && session.user ? (session.user.email || '') : '';
  };

  /* ---------------- 启动闸门：配置 + 登录 ---------------- */

  Cloud.ready = function () {
    if (Cloud.readyPromise) return Cloud.readyPromise;
    Cloud.readyPromise = (async function () {
      var ok = await Cloud.init();
      if (!ok) {
        await Cloud.promptSetup();
        await Cloud.init();
      }
      if (!Cloud.uid) {
        await Cloud.promptLogin();
      }
      if (!Cloud.uid) throw new Error('尚未登录云端账号');
      return true;
    })();
    Cloud.readyPromise.catch(function () { Cloud.readyPromise = null; });
    return Cloud.readyPromise;
  };

  /* ---------------- 读取 ---------------- */

  Cloud.fetchAll = async function () {
    if (!Cloud.client) throw new Error('云端未连接');
    Cloud.status = 'connecting';
    Cloud.paintPill();

    var recRes = await Cloud.client
      .from(T_RECORDS)
      .select('ledger_id,data,deleted_at,rev,updated_at');
    if (recRes.error) {
      Cloud.fail('读取云端记录失败：' + recRes.error.message);
      throw new Error('读取云端记录失败：' + recRes.error.message);
    }

    var metaRes = await Cloud.client
      .from(T_META)
      .select('data')
      .limit(1);
    if (metaRes.error) {
      Cloud.fail('读取账本元信息失败：' + metaRes.error.message);
      throw new Error('读取账本元信息失败：' + metaRes.error.message);
    }

    Cloud.rows = new Map();
    (recRes.data || []).forEach(function (r) { Cloud.rows.set(r.ledger_id, r); });
    Cloud.meta = (metaRes.data && metaRes.data[0] && metaRes.data[0].data) || {};

    Cloud.status = 'ready';
    Cloud.lastSyncAt = new Date();
    Cloud.paintPill();
    return { rows: recRes.data || [], meta: Cloud.meta };
  };

  /** 把云端行还原成与旧版完全相同的 db 对象形状 */
  Cloud.buildDB = function () {
    var out = {};
    Object.keys(Cloud.meta || {}).forEach(function (k) { out[k] = Cloud.meta[k]; });
    out.schema_version = 3;
    out.records = [];
    Cloud.rows.forEach(function (r) { out.records.push(r.data); });
    return out;
  };

  /* ---------------- 写入（增量） ---------------- */

  /**
   * 把 prev -> next 的差异同步到云端。
   * 只写变化的行，因此不会出现"整份覆盖"的风险。
   */
  Cloud.commit = async function (prev, next) {
    if (!Cloud.client) throw new Error('云端未连接');

    var prevMap = new Map();
    (prev.records || []).forEach(function (r) { prevMap.set(r.id, r); });
    var nextMap = new Map();
    (next.records || []).forEach(function (r) { nextMap.set(r.id, r); });

    var upserts = [];
    nextMap.forEach(function (rec, id) {
      var p = prevMap.get(id);
      if (!p || JSON.stringify(p) !== JSON.stringify(rec)) upserts.push(rec);
    });
    var removes = [];
    prevMap.forEach(function (_rec, id) { if (!nextMap.has(id)) removes.push(id); });

    if (upserts.length) {
      var payload = upserts.map(function (rec) {
        var old = Cloud.rows.get(rec.id);
        return {
          ledger_id: rec.id,
          user_id: Cloud.uid,
          data: rec,
          deleted_at: rec.deleted_at || null,
          rev: (old && old.rev ? old.rev : 0) + 1
        };
      });
      var res = await Cloud.client
        .from(T_RECORDS)
        .upsert(payload, { onConflict: 'ledger_id' });
      if (res.error) {
        Cloud.fail('写入云端失败：' + res.error.message);
        throw new Error('写入云端失败：' + res.error.message);
      }
      payload.forEach(function (p) {
        Cloud.rows.set(p.ledger_id, {
          ledger_id: p.ledger_id, data: p.data,
          deleted_at: p.deleted_at, rev: p.rev, updated_at: new Date().toISOString()
        });
      });
    }

    if (removes.length) {
      // ⚠️ 绝不物理删除。
      // 旧实现直接 DELETE，一旦某个客户端的内存里少了某条记录（加载不全、
      // 断线期间陈旧的副本等），就会把云端的真实记录永久删掉。
      // 现在改为：只打软删除标记，数据永远可恢复。
      var softPayload = removes.map(function (id) {
        var old = Cloud.rows.get(id);
        if (!old) return null;
        var patched = JSON.parse(JSON.stringify(old.data));
        patched.deleted_at = patched.deleted_at || new Date().toISOString();
        patched.updated_at = new Date().toISOString();
        return {
          ledger_id: id,
          user_id: Cloud.uid,
          data: patched,
          deleted_at: patched.deleted_at,
          rev: (old.rev || 0) + 1
        };
      }).filter(Boolean);

      if (softPayload.length) {
        var softRes = await Cloud.client
          .from(T_RECORDS)
          .upsert(softPayload, { onConflict: 'ledger_id' });
        if (softRes.error) {
          Cloud.fail('标记删除失败：' + softRes.error.message);
          throw new Error('标记删除失败：' + softRes.error.message);
        }
        softPayload.forEach(function (p) {
          Cloud.rows.set(p.ledger_id, {
            ledger_id: p.ledger_id, data: p.data, deleted_at: p.deleted_at,
            rev: p.rev, updated_at: new Date().toISOString()
          });
        });
        console.warn('[cloud] 客户端内存中缺少 ' + softPayload.length + ' 条记录，已改为软删除而非物理删除');
      }
    }

    // 顶层元信息
    var nextMeta = {};
    Object.keys(next).forEach(function (k) { if (k !== 'records') nextMeta[k] = next[k]; });
    if (JSON.stringify(nextMeta) !== JSON.stringify(Cloud.meta)) {
      var metaRes = await Cloud.client
        .from(T_META)
        .upsert({ user_id: Cloud.uid, data: nextMeta }, { onConflict: 'user_id' });
      if (metaRes.error) {
        Cloud.fail('写入元信息失败：' + metaRes.error.message);
        throw new Error('写入元信息失败：' + metaRes.error.message);
      }
      Cloud.meta = nextMeta;
    }

    Cloud.status = 'ready';
    Cloud.lastSyncAt = new Date();
    Cloud.paintPill();
  };

  /** 首次迁移：把整份账本批量写入云端 */
  Cloud.bulkUpsert = async function (fullDB) {
    var records = fullDB.records || [];
    var CHUNK = 100;
    for (var i = 0; i < records.length; i += CHUNK) {
      var slice = records.slice(i, i + CHUNK);
      var payload = slice.map(function (rec) {
        return {
          ledger_id: rec.id,
          user_id: Cloud.uid,
          data: rec,
          deleted_at: rec.deleted_at || null,
          rev: 1
        };
      });
      var res = await Cloud.client.from(T_RECORDS).upsert(payload, { onConflict: 'ledger_id' });
      if (res.error) throw new Error('导入第 ' + (i + 1) + '–' + (i + slice.length) + ' 条失败：' + res.error.message);
      payload.forEach(function (p) {
        Cloud.rows.set(p.ledger_id, {
          ledger_id: p.ledger_id, data: p.data, deleted_at: p.deleted_at,
          rev: p.rev, updated_at: new Date().toISOString()
        });
      });
      Cloud.paintProgress(Math.min(i + slice.length, records.length), records.length);
    }

    var meta = {};
    Object.keys(fullDB).forEach(function (k) { if (k !== 'records') meta[k] = fullDB[k]; });
    var mr = await Cloud.client.from(T_META).upsert({ user_id: Cloud.uid, data: meta }, { onConflict: 'user_id' });
    if (mr.error) throw new Error('写入账本元信息失败：' + mr.error.message);
    Cloud.meta = meta;

    Cloud.status = 'ready';
    Cloud.lastSyncAt = new Date();
    Cloud.paintPill();
  };

  /* ---------------- 实时同步 ---------------- */

  /* ---------------- 断线重连后补齐数据 ---------------- */
  /**
   * 全量重拉一次云端数据并重绘。
   * 用途：实时连接断过（休眠、切网、锁屏）期间错过的变更，重连后必须补回来。
   */
  Cloud.resync = function () {
    if (Cloud._resyncing) return Cloud._resyncing;
    Cloud._resyncing = Cloud.fetchAll()
      .then(function () {
        try {
          if (typeof db !== 'undefined') db = normalizeDB(Cloud.buildDB());
          if (typeof render === 'function') render();
          Cloud.refreshInfo();
        } catch (e) { console.warn('[cloud] 重绘失败', e); }
      })
      .catch(function (e) { console.warn('[cloud] 补齐失败', e); })
      .then(function () { Cloud._resyncing = null; });
    return Cloud._resyncing;
  };

  Cloud.subscribe = function () {
    if (!Cloud.client || Cloud._subscribed) return;
    Cloud._subscribed = true;
    try {
      Cloud.channel = Cloud.client
        .channel('ledger2-' + Cloud.uid)
        .on('postgres_changes',
          { event: '*', schema: 'public', table: T_RECORDS, filter: 'user_id=eq.' + Cloud.uid },
          function (payload) { Cloud.onRealtime(payload); })
        .subscribe(function (s) {
          if (s === 'SUBSCRIBED') {
            Cloud.status = 'ready';
            Cloud.lastError = '';
            Cloud.paintPill();
            // 首次订阅不用补；之后每次重连都要全量补齐
            if (Cloud._everSubscribed) Cloud.resync();
            Cloud._everSubscribed = true;
          } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED') {
            Cloud.status = 'error';
            Cloud.lastError = '实时连接断开，正在自动重试';
            Cloud.paintPill();
          }
        });
    } catch (e) {
      console.warn('[cloud] 实时订阅失败，将退化为手动刷新', e);
    }
  };

  Cloud.onRealtime = function (payload) {
    var changed = false;
    var row = payload && payload.new;
    var oldRow = payload && payload.old;

    if (payload.eventType === 'DELETE') {
      var id = oldRow && oldRow.ledger_id;
      if (id && Cloud.rows.has(id)) { Cloud.rows.delete(id); changed = true; }
    } else if (row && row.ledger_id) {
      var existing = Cloud.rows.get(row.ledger_id);
      var same = existing && JSON.stringify(existing.data) === JSON.stringify(row.data);
      Cloud.rows.set(row.ledger_id, row);
      if (!same) changed = true;
    }

    if (!changed) return;
    Cloud.lastSyncAt = new Date();
    Cloud.paintPill();
    try {
      if (typeof db !== 'undefined') db = normalizeDB(Cloud.buildDB());
      if (typeof render === 'function') render();
      Cloud.refreshInfo();
    } catch (e) {
      console.warn('[cloud] 应用远端变更失败', e);
    }
  };

  /* ---------------- 状态展示 ---------------- */

  Cloud.fail = function (msg) {
    Cloud.status = 'error';
    Cloud.lastError = msg;
    Cloud.paintPill();
    Cloud.refreshInfo();
  };

  Cloud.paintPill = function () {
    var el = document.getElementById('cloud-pill');
    if (!el) return;
    var map = {
      init: ['连接中…', 'warn'],
      connecting: ['同步中…', 'warn'],
      ready: ['已同步', ''],
      error: ['同步异常', 'bad']
    };
    var m = map[Cloud.status] || map.init;
    el.className = 'cloud-pill ' + m[1];
    el.innerHTML = '<i></i>' + m[0];
    el.title = Cloud.lastError || (Cloud.lastSyncAt ? ('最近同步 ' + Cloud.lastSyncAt.toLocaleTimeString('zh-CN')) : '');
  };

  Cloud.refreshInfo = function () {
    var el = document.getElementById('cloud-info');
    if (!el) return;
    var rows = Cloud.rows.size;
    var alive = 0;
    Cloud.rows.forEach(function (r) { if (!r.deleted_at) alive++; });
    var lines = [
      '账号：' + (Cloud.email || '未登录'),
      '状态：' + (Cloud.status === 'ready' ? '已连接 Supabase' : (Cloud.status === 'error' ? ('异常 · ' + Cloud.lastError) : '连接中')),
      '云端记录：' + alive + ' 条有效 / ' + rows + ' 条总记录',
      '最近同步：' + (Cloud.lastSyncAt ? Cloud.lastSyncAt.toLocaleString('zh-CN') : '—')
    ];
    el.innerHTML = lines.map(function (t) { return '<span style="display:block">' + t + '</span>'; }).join('');
  };

  /* ---------------- 弹层 UI ---------------- */

  var STYLE = [
    '#cloud-overlay{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(32,35,56,.42);backdrop-filter:blur(6px)}',
    '#cloud-overlay[hidden]{display:none}',
    '.cloud-card{width:min(430px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:26px 24px 22px;border-radius:20px;background:#fff;box-shadow:0 24px 60px rgba(23,27,48,.24)}',
    '.cloud-logo{display:grid;place-items:center;width:46px;height:46px;margin-bottom:16px;border-radius:14px;background:linear-gradient(135deg,#5b62e8,#454dcc);color:#fff;font-size:22px;font-weight:700}',
    '.cloud-card h2{margin:0 0 8px;font-size:20px;font-weight:680;color:#202338}',
    '.cloud-card .cloud-sub{margin:0 0 18px;color:#747b8e;font-size:13px;line-height:1.7}',
    '.cloud-field{display:block;margin-bottom:13px}',
    '.cloud-field span{display:block;margin-bottom:6px;color:#4b5163;font-size:12.5px;font-weight:600}',
    '.cloud-field input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #e7e9f2;border-radius:10px;background:#fff;font-size:14px}',
    '.cloud-field input:focus{outline:0;border-color:#8f95f2;box-shadow:0 0 0 3px rgba(91,98,232,.10)}',
    '.cloud-actions{display:flex;gap:10px;margin-top:18px}',
    '.cloud-btn{flex:1;min-height:44px;border:0;border-radius:10px;background:linear-gradient(135deg,#5b62e8,#454dcc);color:#fff;font-size:14px;font-weight:650;cursor:pointer}',
    '.cloud-btn:disabled{opacity:.5;cursor:not-allowed}',
    '.cloud-btn.ghost{background:#f2f3fb;color:#4b52c9;border:1px solid #e2e4f7}',
    '.cloud-btn.plain{background:transparent;color:#747b8e;border:1px solid #e7e9f2}',
    '.cloud-link{display:block;width:100%;margin-top:14px;padding:6px;border:0;background:none;color:#6b72d8;font-size:12.5px;cursor:pointer;text-decoration:underline}',
    '.cloud-hint{margin:14px 0 0;color:#949aac;font-size:11.5px;line-height:1.7}',
    '.cloud-err{margin:14px 0 0;padding:10px 12px;border-radius:9px;background:#fff0f0;color:#c44954;font-size:12.5px;line-height:1.65}',
    '.cloud-err[hidden]{display:none}',
    '.cloud-progress{margin-top:14px;height:6px;border-radius:99px;background:#eef0fa;overflow:hidden}',
    '.cloud-progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5b62e8,#8b91f0);transition:width .2s ease}',
    '.cloud-pill{display:inline-flex;align-items:center;gap:6px;margin-right:10px;padding:8px 12px;border:1px solid #cfe8dd;border-radius:999px;background:#eaf7f1;color:#16735d;font-size:12.5px;font-weight:650;white-space:nowrap;cursor:default}',
    '.cloud-pill i{width:7px;height:7px;border-radius:50%;background:#1aa06e;box-shadow:0 0 0 3px rgba(26,160,110,.16)}',
    '.cloud-pill.warn{border-color:#efdfc5;background:#fff4df;color:#9a631c}',
    '.cloud-pill.warn i{background:#e89c37;box-shadow:0 0 0 3px rgba(232,156,55,.18)}',
    '.cloud-pill.bad{border-color:#f3d3d6;background:#fff0f0;color:#c44954}',
    '.cloud-pill.bad i{background:#e05661;box-shadow:0 0 0 3px rgba(224,86,97,.18)}',
    'body.device-phone .cloud-pill{display:none}'
  ].join('\n');

  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (html != null) n.innerHTML = html;
    return n;
  }

  Cloud.overlay = function (title, sub, bodyHTML) {
    var ov = document.getElementById('cloud-overlay');
    if (!ov) {
      ov = el('div', { id: 'cloud-overlay' });
      document.body.appendChild(ov);
    }
    ov.hidden = false;
    ov.innerHTML =
      '<div class="cloud-card">' +
      '<div class="cloud-logo">账</div>' +
      '<h2>' + title + '</h2>' +
      '<p class="cloud-sub">' + sub + '</p>' +
      '<div id="cloud-body">' + bodyHTML + '</div>' +
      '<p class="cloud-err" id="cloud-err" hidden></p>' +
      '</div>';
    return ov.querySelector('#cloud-body');
  };

  Cloud.closeOverlay = function () {
    var ov = document.getElementById('cloud-overlay');
    if (ov) ov.hidden = true;
  };

  Cloud.showError = function (msg) {
    var e = document.getElementById('cloud-err');
    if (!e) { alert(msg); return; }
    e.hidden = false;
    e.textContent = msg;
  };

  Cloud.paintProgress = function (done, total) {
    var bar = document.getElementById('cloud-progress-bar');
    if (bar) bar.style.width = Math.round((done / Math.max(1, total)) * 100) + '%';
    var txt = document.getElementById('cloud-progress-text');
    if (txt) txt.textContent = '已导入 ' + done + ' / ' + total + ' 条';
  };

  /* 第一步：填 Supabase 配置 */
  Cloud.promptSetup = function () {
    return new Promise(function (resolve) {
      Cloud.overlay(
        '连接云端',
        '生活账本 2.0 把数据存在你自己的 Supabase 项目里。填入下面两项即可，只需配置一次。',
        '<label class="cloud-field"><span>Project URL</span>' +
        '<input id="cloud-url" type="url" placeholder="https://abcdefgh.supabase.co" autocomplete="off"></label>' +
        '<label class="cloud-field"><span>Publishable key（或旧版 anon key）</span>' +
        '<input id="cloud-key" type="text" placeholder="sb_publishable_… 或 eyJhbGciOi…" autocomplete="off"></label>' +
        '<div class="cloud-actions"><button class="cloud-btn" id="cloud-save">保存并继续</button></div>' +
        '<p class="cloud-hint">在 Supabase 控制台 → Project Settings → <b>API Keys</b> 里找到。<br>' +
        'Publishable 与 anon 都是公开密钥，放在网页里是安全的：真正的保护来自数据库的行级权限（RLS）。<br>' +
        '切勿使用 Secret / service_role 密钥。</p>'
      );

      var prev = Cloud.loadCfg();
      if (prev) {
        document.getElementById('cloud-url').value = prev.url || '';
        document.getElementById('cloud-key').value = prev.key || '';
      }

      document.getElementById('cloud-save').onclick = function () {
        var url = (document.getElementById('cloud-url').value || '').trim();
        var key = (document.getElementById('cloud-key').value || '').trim();
        if (!/^https?:\/\//i.test(url)) return Cloud.showError('Project URL 需要以 https:// 开头');
        if (key.length < 40) return Cloud.showError('anon key 看起来不完整，请重新复制');
        Cloud.saveCfg({ url: url.replace(/\/+$/, ''), key: key });
        Cloud.client = null;
        Cloud.closeOverlay();
        resolve(true);
      };
    });
  };

  /* 第二步：登录 / 注册 */
  Cloud.promptLogin = function () {
    return new Promise(function (resolve) {
      var remembered = Cloud.lastEmail();
      Cloud.overlay(
        '登录云端账号',
        remembered
          ? ('账号已记住：' + remembered + '。输入密码就能继续。')
          : '数据只属于你。首次使用请先点「注册」，用邮箱创建账号。',
        '<label class="cloud-field"><span>邮箱</span>' +
        '<input id="cloud-email" type="email" placeholder="you@example.com" autocomplete="username"></label>' +
        '<label class="cloud-field"><span>密码</span>' +
        '<input id="cloud-pass" type="password" placeholder="至少 6 位" autocomplete="current-password"></label>' +
        '<div class="cloud-actions">' +
        '<button class="cloud-btn" id="cloud-login">登录</button>' +
        '<button class="cloud-btn ghost" id="cloud-signup">注册</button>' +
        '</div>' +
        '<button class="cloud-link" id="cloud-recfg">重新填写云端配置</button>'
      );

      var emailEl = document.getElementById('cloud-email');
      var passEl = document.getElementById('cloud-pass');

      // 预填上次登录的邮箱，并直接把光标放到密码框
      if (remembered) {
        emailEl.value = remembered;
        passEl.focus();
      } else {
        emailEl.focus();
      }

      async function doAuth(kind) {
        var email = (emailEl.value || '').trim();
        var pass = passEl.value || '';
        if (!email) return Cloud.showError('请填写邮箱');
        if (pass.length < 6) return Cloud.showError('密码至少 6 位');
        var btns = [document.getElementById('cloud-login'), document.getElementById('cloud-signup')];
        btns.forEach(function (b) { b.disabled = true; });
        try {
          var res;
          if (kind === 'signup') {
            res = await Cloud.client.auth.signUp({ email: email, password: pass });
          } else {
            res = await Cloud.client.auth.signInWithPassword({ email: email, password: pass });
          }
          if (res.error) throw new Error(res.error.message);
          var session = res.data && res.data.session;
          if (!session) {
            throw new Error('注册成功，但还需要邮箱验证。请到 Supabase 控制台 Authentication → Sign In / Providers → Email 关闭 “Confirm email”，然后重新登录。');
          }
          Cloud.setSession(session);
          Cloud.saveLastEmail(email);
          Cloud.closeOverlay();
          resolve(true);
        } catch (e) {
          Cloud.showError(e.message || String(e));
        } finally {
          btns.forEach(function (b) { b.disabled = false; });
        }
      }

      document.getElementById('cloud-login').onclick = function () { doAuth('login'); };
      document.getElementById('cloud-signup').onclick = function () { doAuth('signup'); };
      document.getElementById('cloud-recfg').onclick = function () {
        Cloud.clearCfg();
        Cloud.client = null;
        Cloud.overlay('重新配置', '填写新的 Supabase 项目信息。', '<div class="cloud-actions"><button class="cloud-btn" id="cloud-go">开始</button></div>');
        document.getElementById('cloud-go').onclick = function () {
          Cloud.closeOverlay();
          Cloud.promptSetup().then(function () {
            return Cloud.init();
          }).then(function () {
            Cloud.closeOverlay();
            location.reload();
          });
        };
      };
    });
  };

  /* 首次导入确认 */
  Cloud.confirmSeedImport = function (incoming) {
    return new Promise(function (resolve) {
      var total = incoming.records.length;
      var alive = incoming.records.filter(function (r) { return !r.deleted_at; }).length;
      var sum = 0;
      incoming.records.forEach(function (r) { if (!r.deleted_at) sum += Number(r.price) || 0; });
      Cloud.overlay(
        '导入你的账本',
        '云端目前是空的。这个文件里内置了一份完整账本快照，可以直接导进去。',
        '<p class="cloud-sub" style="margin:0 0 4px">共 <b>' + total + '</b> 条记录（<b>' + alive + '</b> 条有效，' +
        (total - alive) + ' 条已删除），实付合计 <b>￥' + sum.toFixed(2) + '</b>。</p>' +
        '<div class="cloud-progress"><i id="cloud-progress-bar"></i></div>' +
        '<p class="cloud-hint" id="cloud-progress-text">导入后即可在手机和电脑上同时使用。</p>' +
        '<div class="cloud-actions">' +
        '<button class="cloud-btn" id="cloud-import">确认导入</button>' +
        '<button class="cloud-btn plain" id="cloud-skip">暂不导入</button>' +
        '</div>'
      );
      document.getElementById('cloud-import').onclick = function () {
        this.disabled = true;
        resolve(true);
      };
      document.getElementById('cloud-skip').onclick = function () {
        Cloud.closeOverlay();
        resolve(false);
      };
    });
  };

  /* ---------------- 挂载 UI ---------------- */

  Cloud.mountUI = function () {
    // 样式
    var st = document.createElement('style');
    st.textContent = STYLE;
    document.head.appendChild(st);

    // 顶栏同步状态
    var actions = document.querySelector('.topbar .header-actions');
    if (actions && !document.getElementById('cloud-pill')) {
      var pill = el('span', { id: 'cloud-pill', class: 'cloud-pill' }, '<i></i>连接中…');
      actions.insertBefore(pill, actions.firstChild);
    }

    // 观察 #view，数据页出现时刷新信息
    var view = document.getElementById('view');
    if (view) {
      new MutationObserver(function () { Cloud.refreshInfo(); }).observe(view, { childList: true });
    }

    // 页面回到前台时补齐（手机锁屏 / 电脑休眠后最容易漏数据）
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible' || !Cloud.uid) return;
      var stale = !Cloud.lastSyncAt || (Date.now() - Cloud.lastSyncAt.getTime() > 15000);
      if (stale) Cloud.resync();
    });

    // 点同步标识 = 手动补齐
    var pillEl = document.getElementById('cloud-pill');
    if (pillEl) {
      pillEl.style.cursor = 'pointer';
      pillEl.addEventListener('click', function () {
        if (!Cloud.uid) return;
        Cloud.status = 'connecting';
        Cloud.paintPill();
        Cloud.resync();
      });
    }

    // 数据页按钮（事件委托，重渲染后依然有效）
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[id^="cloud-"]') : null;
      if (!t) return;
      var id = t.id;
      if (id === 'cloud-refresh') {
        t.disabled = true;
        Cloud.fetchAll().then(function () {
          db = normalizeDB(Cloud.buildDB());
          render();
          Cloud.refreshInfo();
          if (typeof toast === 'function') toast('已从云端刷新');
        }).catch(function (err) {
          if (typeof toast === 'function') toast(err.message);
        }).finally(function () { t.disabled = false; });
      } else if (id === 'cloud-reconfig') {
        Cloud.clearCfg();
        Cloud.client = null;
        Cloud._subscribed = false;
        location.reload();
      } else if (id === 'cloud-logout') {
        if (!confirm('退出登录后，本机将无法查看云端账本。确定退出？')) return;
        Cloud.client.auth.signOut().then(function () { location.reload(); });
      }
    });

    Cloud.paintPill();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', Cloud.mountUI);
  } else {
    Cloud.mountUI();
  }
})();

</script>
<script>'use strict';
/* 数据、常量、本地存储与旧版迁移 */
const STORE_KEY=window.STORAGE_TARGET||'ledger.v3';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const iso=()=>new Date().toISOString();
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const monthOf=d=>String(d||'').slice(0,7);
const validDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;const t=Date.parse(s+'T00:00:00Z');return Number.isFinite(t)&&new Date(t).toISOString().slice(0,10)===s;};
const daysBetween=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);
const money=n=>Number.isFinite(Number(n))?`¥${Number(n).toFixed(2)}`:'—';
const round2=n=>Math.round((Number(n)||0)*100)/100;
const num=(v,d=0)=>Number(v||0).toFixed(d);
const escId=s=>String(s||'').replace(/[^a-z0-9]/gi,'');
const SCENES=[
 {id:'food',label:'餐饮',icon:'🍚',defaultNecessity:'required'},
 {id:'pet',label:'宠物',icon:'🐱',defaultNecessity:'required'},
 {id:'car',label:'交通用车',icon:'🚗',defaultNecessity:'required'},
 {id:'clothing',label:'服饰',icon:'👕',defaultNecessity:'optional'},
 {id:'snacks',label:'食品',icon:'🍪',defaultNecessity:'regular'},
 {id:'household',label:'日用家居',icon:'🧺',defaultNecessity:'regular'},
 {id:'service',label:'生活服务',icon:'💈',defaultNecessity:'regular'},
 {id:'game',label:'游戏',icon:'🎮',defaultNecessity:'optional'},
 {id:'other',label:'其他',icon:'🏷️',defaultNecessity:'optional'}
];

async function restoreSeededLedger(){
 /* 云端已有数据：直接以云端为准 */
 if(Cloud.rows.size>0) return {added:0,updated:0,removed:0,active:db.records.filter(function(r){return !r.deleted_at}).length};
 var seed=window.__LEDGER_RESTORE_SEED__;
 if(!seed||!Array.isArray(seed.records))return {added:0,updated:0,removed:0,active:0};
 var incoming=normalizeDB(seed);
 var ok=await Cloud.confirmSeedImport(incoming);
 if(!ok)return {added:0,updated:0,removed:0,active:0};
 await Cloud.bulkUpsert(incoming);
 await Cloud.fetchAll();
 db=normalizeDB(Cloud.buildDB());
 Cloud.closeOverlay();
 return {added:db.records.length,updated:0,removed:0,active:db.records.filter(function(r){return !r.deleted_at}).length};
}

  let digits='';for(const ch of value){if(ch in CN_DIGITS)digits+=CN_DIGITS[ch];else if(/\d/.test(ch))digits+=ch;else return NaN;}total=Number(digits);
 }else{
  const units={'十':10,'百':100,'千':1000,'万':10000,'亿':100000000};
  for(const ch of value){
   if(ch in CN_DIGITS){digit=CN_DIGITS[ch];has=true;}
   else if(/\d/.test(ch)){digit=has?digit*10+Number(ch):Number(ch);has=true;}
   else if(units[ch]){const u=units[ch];if(u<10000){section+=(has?digit:1)*u;}else{section+=has?digit:0;if(u===100000000){total=(total+section)*u;}else total+=section*u;section=0;}digit=0;has=false;}

  }

function parseSentences(text){

 const content=shared.text.replace(/[|｜]/g,' ').replace(/\d{1,3}(?:,\d{3})+(?:\.\d+)?/g,s=>s.replace(/,/g,''));
 for(const block of content.split(/[;；\n\r。]+/)){
  const parts=[];
  for(const seg of block.split(/[,，、]+/).map(s=>s.trim()).filter(Boolean)){
   const paymentOnly=PAY_KEYWORD_RE.test(seg)&&!cleanName(parsePlatform(parsePayment(seg).rest).rest.replace(/^(?:使用|用)/,''));
   const detailOnly=/^(?:原价|优惠前|实付|实际支付|到手价|红包|碰一下|满减|满\s*\d|优惠券|优惠卷|商家减免|商家优惠|减免|抵扣|立减|优惠了|打\s*\d|油价|单价|每升)/.test(seg);
   if(parts.length&&(paymentOnly||detailOnly))parts[parts.length-1]+=' '+seg;
   else parts.push(seg);
  }
  a.push(...parts);

  const rec=parseSentence(seg);

}

function refundCenterCard(r,pendingIds){
 const pending=pendingIds.has(r.id),received=receivedRefundOf(r),unreceived=round2(Math.max(0,Number(r.price)-received));
 const label=pending?(received>0?'部分到账，仍在退款中':'退款待到账'):'退款已到账';
 const finalLabel=pending?'当前未退回商品款':received>=Number(r.price)?'商品款已全额退回':'退款后剩余商品支出';
 return `<article class="refund-order"><div class="refund-order-head"><span class="refund-order-icon" aria-hidden="true">↶</span><div><h3>${esc(r.name)}</h3><p>${esc(purchaseDateTimeText(r))} · ${esc(r.payment_method||'支付方式未填写')}</p></div><span class="refund-center-status ${pending?'watch':'good'}">${label}</span></div><div class="refund-money-grid"><div><span>支付金额</span><b>${money(r.price)}</b></div><div><span>已到账退款</span><b>${money(received)}</b></div><div><span>${pending?'预计还会退回':'退款状态'}</span><b class="${pending&&r.expected_refund==null?'refund-missing':''}">${pending?(r.expected_refund==null?'未填写':money(r.expected_refund)):'已到账'}</b></div></div><div class="refund-order-foot"><div><b>${finalLabel}${pending||unreceived>0?' '+money(unreceived):''}</b><p>${pending?'尚未到账的钱不提前扣减支出':'已到账退款已按原消费月份冲减支出'}</p></div><button class="btn small" data-refund-update="${esc(r.id)}" type="button">${pending?'更新退款':'查看 / 修改'} ↗</button></div></article>`;
}
function renderRefunds(){
 const s=refundCenterStats(activeRecords('')),filter=['pending','received','all'].includes(state.refundCenterFilter)?state.refundCenterFilter:'pending',pendingIds=new Set(s.pending.map(r=>r.id));
 const rows=filter==='pending'?s.pending:filter==='received'?s.received:s.tracked;
 const emptyTitle=filter==='pending'?'目前没有待到账退款':filter==='received'?'还没有已结束的到账退款':'还没有退款记录';
 return `<div class="refund-center-page"><div class="refund-center-heading"><div><h2>退款与退货追踪中心</h2><p>只关心钱有没有回来，不用填写复杂进度和运费信息</p></div><button class="btn small" data-go="home" type="button">返回首页</button></div><section class="refund-center-metrics" aria-label="退款摘要"><div class="refund-metric primary"><span>待到账退款</span><strong>${esc(refundExpectedText(s))}</strong><small>${s.pending.length} 笔退款中${s.unknown?` · ${s.unknown} 笔金额未填`:''}</small></div><div class="refund-metric"><span>退款待办</span><strong>${s.pending.length} 笔</strong><small>包括以前月份，避免漏掉</small></div><div class="refund-metric"><span>已到账退款</span><strong>${money(s.receivedTotal)}</strong><small>${s.tracked.filter(r=>receivedRefundOf(r)>0).length} 笔 · 含已部分到账金额</small></div></section><div class="refund-center-filters" role="group" aria-label="退款记录筛选">${[['pending','退款待到账',s.pending.length],['received','已到账',s.received.length],['all','全部',s.tracked.length]].map(([id,label,count])=>`<button type="button" class="${filter===id?'active':''}" data-refund-filter="${id}" aria-pressed="${filter===id}">${label} <span>${count}</span></button>`).join('')}</div><div class="refund-center-grid"><div class="refund-orders">${rows.length?rows.map(r=>refundCenterCard(r,pendingIds)).join(''):`<div class="refund-center-empty"><h3>${emptyTitle}</h3><p>${filter==='pending'?'钱到账后更新累计金额，并将退款状态改为“已到账”，就会移入历史记录。':'有对应退款记录后，这里会自动显示。'}</p></div>`}${filter==='pending'&&s.received.length?`<details class="refund-center-history"><summary>已到账记录 · ${s.received.length} 笔 <span>展开查看 ⌄</span></summary><div class="refund-orders">${s.received.map(r=>refundCenterCard(r,pendingIds)).join('')}</div></details>`:''}</div><aside class="refund-center-help"><h3>两步就够了</h3><div><b>1　还没到账</b><p>保持“退款中”；知道金额就填预计还会退回，不确定可以留空。</p></div><div><b>2　钱到账了</b><p>填写累计已到账金额，全部到账后选“已到账”；部分到账仍选“退款中”。</p></div><p class="refund-center-callout">预计退款只提醒，不提前扣钱。更新的是同一笔原消费记录，不另记退款收入。</p></aside></div></div>`;
}
function showRefundUpdate(id){
 const r=db.records.find(x=>x.id===id&&!x.deleted_at);if(!r)return toast('记录不存在或已删除');
 const existing=$('#refund-quick-dialog');if(existing)existing.remove();
 const d=document.createElement('dialog');d.id='refund-quick-dialog';d.className='refund-quick-dialog';document.body.appendChild(d);
 const initial=pendingTasks([r]).length?'pending':refundStatusOf(r);
 d.innerHTML=`<div class="dialog-head"><h2>更新退款</h2><button class="icon-btn" type="button" id="refund-quick-close" aria-label="关闭">×</button></div><form id="refund-quick-form"><div class="dialog-body"><h3 class="refund-quick-name">${esc(r.name)}</h3><p class="refund-quick-note">支付金额 ${money(r.price)} · 只更新这笔记录的退款状态与金额</p><label class="field">退款状态<select id="refund-quick-status">${options([['none','无待处理退款'],['pending','退款中（含部分到账）'],['received','已到账']],initial)}</select></label><label class="field refund-quick-amount-field"><span class="refund-quick-field-head">累计已到账退款<button class="refund-quick-fill" type="button" id="refund-quick-fill-full">填入支付金额</button></span><input id="refund-quick-amount" type="number" min="0" max="${Number(r.price)}" step="0.01" inputmode="decimal" required value="${receivedRefundOf(r)}"><p class="hint">填写已经实际到账的总金额；还没到账填 0。</p></label><label class="field" id="refund-quick-expected-field">预计还会退回（选填）<input id="refund-quick-expected" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(r.expected_refund??'')}" placeholder="不确定可以留空"><p class="hint">只做提醒，不会提前扣减支出。</p></label><p id="refund-quick-error" class="error" role="alert"></p></div><div class="dialog-foot"><button class="btn" type="button" id="refund-quick-cancel">取消</button><button class="btn primary" type="submit" id="refund-quick-save">保存退款</button></div></form>`;
 const status=$('#refund-quick-status'),receivedInput=$('#refund-quick-amount'),expectedInput=$('#refund-quick-expected'),fillFull=$('#refund-quick-fill-full');let saving=false;
 const sync=()=>{$('#refund-quick-expected-field').hidden=status.value!=='pending'};sync();status.onchange=sync;
 if(fillFull)fillFull.onclick=()=>{receivedInput.value=Number(r.price).toFixed(2);$('#refund-quick-error').textContent='';receivedInput.focus()};
 const close=()=>{if(!saving)d.close()};$('#refund-quick-close').onclick=close;$('#refund-quick-cancel').onclick=close;d.oncancel=e=>{if(saving)e.preventDefault()};d.onclose=()=>d.remove();
 $('#refund-quick-form').onsubmit=async e=>{e.preventDefault();if(saving)return;saving=true;const save=$('#refund-quick-save');save.disabled=true;
  try{
   const current=db.records.find(x=>x.id===id&&!x.deleted_at);if(!current)throw new Error('记录不存在或已删除');
   const amount=reqNum(receivedInput.value),expected=status.value==='pending'?optNum(expectedInput.value):null;
   const updated={...current,refund_status:status.value,refund:amount,expected_refund:expected,updated_at:iso()};
   normalizeRecord(updated,false);
   const next=structuredClone(db),i=next.records.findIndex(x=>x.id===id);next.records[i]=updated;
   await commitDB(next);d.close();render();toast('退款已保存，支出与提醒已更新');
  }catch(err){$('#refund-quick-error').textContent=err.message;$('#refund-quick-error').scrollIntoView({block:'nearest'})}
  finally{saving=false;if(save.isConnected)save.disabled=false}
 };
 d.showModal();
}

}

function renderList(){
 const list=filteredRecords(),limit=state.listLimit||200,groups=new Map();
 for(const r of list){if(!groups.has(r.purchase_date))groups.set(r.purchase_date,[]);groups.get(r.purchase_date).push(r)}
 let left=limit;
 const days=[...groups].sort((a,b)=>b[0].localeCompare(a[0])).map(([date,items])=>{
  if(left<=0)return '';const shown=items.slice(0,left);left-=shown.length;
  const wd=['周日','周一','周二','周三','周四','周五','周六'][new Date(date+'T12:00:00').getDay()]||'';
  return `<section class="day-group" data-day="${esc(date)}"><header class="day-head"><div><h3><time datetime="${esc(date)}">${esc(date)}</time><small>${wd}${date===today()?' · 今天':''}</small></h3><p>${items.length} 笔${shown.length<items.length?` · 已展示 ${shown.length} 笔`:''}</p></div><div class="day-total"><small>当日实际</small><b>${money(actualTotal(items))}</b></div></header><div class="record-list">${shown.map(recordHTML).join('')}</div></section>`;
 }).join('');
 return `${filterHTML()}<div class="section-title"><h2>${list.length} 笔 · ${groups.size} 天</h2><b>实际 ${money(actualTotal(list))}</b></div>${list.length?`<p class="muted day-scope">金额为当前筛选范围内的实际支出；预计退款不扣减。${REFUND_DATE_NOTE}</p>`+days:empty('没有符合条件的记录','试试清除筛选，或记下新的一笔。')}${list.length>limit?`<button class="btn day-more" id="list-more">继续显示记录（已展示 ${limit} / ${list.length} 笔）</button>`:''}`;

function dailyChartHTML(days){

 const recent=days.slice(-31),negative=recent.some(d=>d.value<0),ymax=Math.max(1,...recent.map(d=>d.value));

 return `<div class="chart-bars">${recent.map(d=>`<span title="${d.id} · ${money(d.value)}"><i style="height:${d.value>0?Math.max(2,d.value/ymax*110):0}px"></i><small>${state.month?d.id.slice(8):d.id.slice(5)}</small></span>`).join('')}</div><p class="hint">${days.length>31?'图中仅展示最近 31 个有记录的日期；完整数据见下方明细。':'按消费日期汇总；完整金额见下方明细。'}</p>`;
}
function alipaySplitHtml(list){const pay=list.filter(r=>r.alipay_bill_category!=='提现流水'),wd=list.filter(r=>r.alipay_bill_category==='提现流水'),pv=actualTotal(pay),wv=actualTotal(wd),mx=Math.max(1,Math.abs(pv),Math.abs(wv));const row=(label,v,n)=>`<div class="breakdown-row"><span>${label}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Math.abs(v)/mx*100))}%"></i></div><b>${money(v)}<small style="display:block;font-weight:400;opacity:.7;font-size:11px">${n} 笔</small></b></div>`;return `<div class="section-title"><h2>支付宝对账</h2><small>按实际支出</small></div><section class="card stack">${row('支付支出',pv,pay.length)}${row('提现流水',wv,wd.length)}<p class="hint">提现流水仍是真实消费，两项相加 = 实际支出 ${money(round2(pv+wv))}；仅用于和支付宝账单对账。</p></section>`;}function renderInsights(){

 <p class="muted day-scope">实际支出 = 消费实付 − 已到账商品退款 + 退货运费 + 运费险保费 − 已报销运费。本范围附加费用净额 ${money(feeAdjustmentTotal(list))}；预计退款不扣减。${REFUND_DATE_NOTE}</p>

 <div class="section-title"><h2>场景分布</h2><small>按实际支出</small></div><section class="card stack">${negative?'<p class="hint">含负净额，仅显示金额，不画比例条。</p>':''}${groups.length?groups.map(g=>`<div class="breakdown-row"><span>${SCENE_MAP[g.id]?.icon} ${SCENE_MAP[g.id]?.label}</span>${negative?'<span></span>':`<div class="bar"><i style="width:${Math.max(0,g.value/max*100)}%"></i></div>`}<b>${money(g.value)}</b></div>`).join(''):'<p class="muted">暂无数据</p>'}</section>

function setReturnStatus(status){
 editorDirty=true;
 $('#e-return_status').value=status;
 $$('[data-return-status]').forEach(b=>{const on=b.dataset.returnStatus===status;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
 updateReturnVisibility();
}
function setRefundStatus(status){
 editorDirty=true;
 $('#e-refund_status').value=status;
 $$('[data-refund-status]').forEach(b=>{const on=b.dataset.refundStatus===status;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
 // 状态切换只更新界面，绝不把预计金额自动写成真实到账金额。

function updateReturnVisibility(){
 const refundStatus=$('#e-refund_status')?.value||'none';
 $('#fee-add').hidden=editorFeeOpen;

 $('#received-hint').textContent=refundStatus==='pending'?'已到账的部分填在这里；还没到账填 0。只有已到账部分抵扣支出。':'填写累计实际到账金额，包含此前部分到账；选择状态不会自动填金额。';
 $('#refund-none-hint').textContent='若已经有退款到账，请选“已到账”；若还有退款未到，请选“退款中”。';

function updateFuelVisibility(){

function renderDiscountRows(rows){$('#discount-rows').innerHTML=rows.map((x,i)=>`<div class="discount-row" style="display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;margin-top:8px"><select aria-label="优惠类型" class="discount-type">${options([...new Set([...DISCOUNT_TYPES,x.type].filter(Boolean))],x.type)}</select><input type="number" min="0" step="0.01" inputmode="decimal" aria-label="优惠金额" class="discount-amount" placeholder="减免金额" value="${esc(x.amount)}"><button type="button" class="icon-btn discount-remove" data-i="${i}" aria-label="删除优惠">×</button></div>`).join('');$$('.discount-amount').forEach(el=>el.oninput=calcDiscount);$$('.discount-remove').forEach(b=>b.onclick=()=>{const a=readDiscountRows();a.splice(Number(b.dataset.i),1);renderDiscountRows(a);calcDiscount();editorDirty=true})}
function readDiscountRows(){return $$('.discount-row').map(el=>({type:$('.discount-type',el).value,amount:$('.discount-amount',el).value}))}
function calcDiscount(){if(!$('#has-discount').checked)return;const gross=Number($('#e-original_price').value),ds=readDiscountRows();const sum=ds.reduce((s,d)=>s+Number(d.amount||0),0);const paid=Math.round((gross-sum)*100)/100;if(paid<0||!Number.isFinite(paid)){$('#discount-result').textContent='优惠金额不能超过优惠前金额';return}$('#e-price').value=paid;$('#discount-result').textContent=`优惠合计 ${money(sum)}，实付 ${money(paid)}`}
function updatePrevious(){const p=previousPurchase($('#e-name').value,$('#e-scene').value,{date:$('#e-purchase_date').value,ignoreId:editorDraft?.id});const el=$('#previous-purchase');el.classList.toggle('show',!!p);el.textContent=p?`上次购入：${p.purchase_date} · ${daysBetween(p.purchase_date,$('#e-purchase_date').value)} 天前 · 实付 ${money(p.price)}`:''}
async function closeEditor(){if($('#save-record')?.disabled)return;if(editorDirty&&!await confirmDialog('放弃这次填写？','尚未保存的修改将不会保留。'))return;$('#editor-dialog').close();if(editorReturn){const cb=editorReturn;editorReturn=null;cb(null)}}
async function saveEditor(){
 const save=$('#save-record');if(save.disabled)return;save.disabled=true;
 try{
  const obj={...editorDraft,...Object.fromEntries(new FormData($('#record-form')))};delete obj.warnings;delete obj.previous;delete obj.raw;
  if(!validDate(obj.purchase_date)||obj.purchase_date>today())throw new Error('请选择今天或之前的有效日期');
  if(obj.price==='')throw new Error('请填写实付金额');
  obj.is_fuel=$('#e-is_fuel').checked;
  obj.refund=optNum(obj.refund)||0;
  obj.expected_refund=obj.refund_status==='pending'?optNum(obj.expected_refund):null;
  // 退货状态不清空任何历史费用；到账金额由用户填写并由 normalizeRecord 校验。
  if($('#has-discount').checked){if(obj.original_price==='')throw new Error('请填写优惠前金额');const ds=readDiscountRows();if(ds.some(d=>d.amount===''||!Number.isFinite(Number(d.amount))||Number(d.amount)<0))throw new Error('请补全优惠金额，或删除空白优惠项');const gross=Number(obj.original_price),sum=ds.reduce((s,d)=>s+Number(d.amount),0);if(!Number.isFinite(gross)||gross<0||sum>gross)throw new Error('优惠不能超过优惠前金额');obj.original_price=gross;obj.discounts=ds.map(d=>({...d,amount:Number(d.amount)}));obj.price=Math.round((gross-sum)*100)/100;obj.discount_rate=null}
  else{obj.original_price=null;obj.discounts=[];obj.discount_rate=null}
  if(obj.purchase_time&&obj.source_system!=='alipay')obj.purchase_period=periodFromTime(obj.purchase_time);
  obj.purchase_datetime=obj.purchase_time?`${obj.purchase_date} ${obj.purchase_time}`:'';
  const r=normalizeRecord(obj,true);r.updated_at=iso();
  if(editorReturn){
   const cb=editorReturn;
   if(editorSaveDirect){await cb(r);editorReturn=null;$('#editor-dialog').close()}
   else{editorReturn=null;$('#editor-dialog').close();cb(r)}
   return;
  }
  const next=structuredClone(db),i=next.records.findIndex(x=>x.id===r.id);if(i>=0)next.records[i]=r;else next.records.push(r);await commitDB(next);$('#editor-dialog').close();render();toast(i>=0?'修改已保存':'已记下这一笔');
 }catch(e){$('#editor-error').textContent=e.message;$('#editor-error').scrollIntoView({block:'nearest'});}finally{save.disabled=false}
}

function startBatch(text){
 if(!text.trim())return toast('先写一句消费内容');
 try{
  const records=parseSentences(text);
  if(!records.length)return toast('请写上消费内容和金额');
  state.batch=records;state.batchText=text;
  if(records.length===1)openParsedRecord(records[0],text);
  else showBatch();
 }catch(e){toast(e.message)}
}
function openParsedRecord(record,rawText){
 openEditor(record,async confirmed=>{
  if(!confirmed){state.batch=[];state.batchText='';return}
  const rec=normalizeRecord({
   ...confirmed,
   id:uid(),created_at:iso(),updated_at:iso(),
   note:confirmed.note||('一句话记账原文：'+rawText).slice(0,5000)
  },true);
  const next=structuredClone(db);
  next.records.push(rec);
  await commitDB(next);
  state.batch=[];state.batchText='';
  const input=$('#sentence');if(input)input.value='';
  render();toast('已记下这一笔');
 },true);
}
function showBatch(){const d=$('#editor-dialog');d.innerHTML=`<div class="dialog-head"><h2>核对 ${state.batch.length} 笔</h2><button class="icon-btn" id="batch-close" aria-label="关闭">×</button></div><div class="dialog-body"><p class="muted">本地识别，不自动保存；有误可点「修改」。</p>${state.batch.map((r,i)=>`<article class="batch-card"><div class="record-title"><b>${i+1}. ${esc(r.name)}</b>${sceneTag(r)}${needTag(r)}<b style="margin-left:auto">${r.price===''?'待填金额':money(r.price)}</b></div><p class="muted" style="margin-top:6px">${purchaseDateTimeText(r)} · ${r.purchase_period||'未注明'} · ${esc(r.payment_method)}${r.platform?' · '+esc(r.platform):''}</p>${r.discounts.length?`<p class="hint">优惠前 ${money(r.original_price)} · ${r.discounts.map(x=>esc(x.type)+' −'+money(x.amount)).join(' / ')}</p>`:''}${previousPurchase(r.name,r.scene,{date:r.purchase_date})?`<p class="hint">上次购入：${previousPurchase(r.name,r.scene,{date:r.purchase_date}).purchase_date}</p>`:''}${(r.warnings||[]).map(w=>`<p class="warning" style="margin-top:7px">${esc(w)}</p>`).join('')}<div style="display:flex;gap:8px;margin-top:9px"><button class="btn small" data-batch-edit="${i}">修改</button><button class="btn small" data-batch-remove="${i}">移除</button></div></article>`).join('')}<p class="error" id="batch-error" role="alert"></p></div><div class="dialog-foot"><span class="muted" style="margin-right:auto">实付合计 ${money(totalOf(state.batch))}</span><button class="btn primary" id="batch-save" ${state.batch.length?'':'disabled'}>确认保存 ${state.batch.length} 笔</button></div>`;if(!d.open)d.showModal();d.oncancel=null;$('#batch-close').onclick=()=>d.close();$$('[data-batch-edit]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.batchEdit);openEditor(state.batch[i],r=>{if(r)state.batch[i]={...r,warnings:[]};showBatch()})});$$('[data-batch-remove]').forEach(b=>b.onclick=()=>{state.batch.splice(Number(b.dataset.batchRemove),1);showBatch()});$('#batch-save').onclick=async()=>{const btn=$('#batch-save');if(btn.disabled)return;btn.disabled=true;try{const next=structuredClone(db);for(const r of state.batch){if(r.price==='')throw new Error('还有未填写的金额，请点修改补全');if(r.warnings?.length)throw new Error('有需要核对的提示，请逐笔点修改并确认后再保存');const {warnings,previous,raw,...rec}=r;next.records.push(normalizeRecord({...rec,note:rec.note||('一句话记账原文：'+(raw||'')).slice(0,5000),id:uid(),created_at:iso(),updated_at:iso()},true))}await commitDB(next);const count=state.batch.length;state.batch=[];state.batchText='';d.close();render();toast(`已保存 ${count} 笔记录`)}catch(e){$('#batch-error').textContent=e.message}finally{btn.disabled=false}}}
let exportBusy=false;
async function exportJSON(){if(exportBusy)return;exportBusy=true;try{const out=structuredClone(db);out.last_backup_at=iso();out.backup_dirty_ids=[];download(`生活账本-v3-${today()}.json`,JSON.stringify(out,null,2));await commitDB(out);render();toast('已生成 JSON，请确认保存；此操作不会上传飞书')}catch(e){toast(e.message)}finally{exportBusy=false}}
function exportCSV(){const head=['名称','生活场景','必要性','购买频率','实付金额','消费日期','购买时间','消费时段','支付方式','支付宝账单归类','平台','优惠前金额','优惠合计','退货状态','已到账退款','备注','退款状态','预计还会退回','退货运费','运费险保费','运费已报销','附加费用净额','实际支出'];const rows=db.records.filter(r=>!r.deleted_at).map(r=>[r.name,SCENE_MAP[r.scene].label,NEC_MAP[r.necessity].label,r.purchase_frequency?(PURCHASE_FREQUENCY_MAP[r.purchase_frequency]?.label||r.purchase_frequency):'',r.price,r.purchase_date,r.purchase_datetime||'',r.purchase_period,r.payment_method,r.alipay_bill_category||'支付支出',r.platform,r.original_price??'',discountTotal(r),RETURN_STATUS_MAP[r.return_status]||r.return_status,receivedRefundOf(r),r.note,REFUND_STATUS_MAP[refundStatusOf(r)],refundStatusOf(r)==='pending'?(r.expected_refund??''):'',r.return_shipping_fee??'',r.return_insurance_fee??'',r.return_shipping_reimbursement??'',feeAdjustmentTotal([r]),actualOf(r)]);const quote=x=>'"'+String(x??'').replace(/^[=+@-]/,'\t$&').replace(/"/g,'""')+'"';download(`生活账本-${today()}.csv`,'\uFEFF'+[head,...rows].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已导出 CSV；金额按原消费日期归属')}
let importPending=null,importReading=false;
function createImportPlan(current,incoming){
 const existing=new Map(current.records.map(r=>[r.id,r])),added=[],same=[],conflicts=[];
 for(const r of incoming.records){const local=existing.get(r.id);if(!local)added.push(r);else if(businessSig(local)===businessSig(r))same.push(r.id);else conflicts.push({local,incoming:r})}
 return {incoming,added,same,conflicts,choices:new Map(),index:0,saving:false,addVehicle:!!incoming.vehicle&&!current.vehicle};
}
const IMPORT_LABELS={name:'名称',price:'实付金额',purchase_date:'消费日期',purchase_datetime:'购买时间',purchase_period:'消费时段',purchase_time:'购买时分',payment_method:'支付方式',alipay_bill_category:'支付宝账单归类',scene:'生活场景',subcategory:'子分类',necessity:'必要性',purchase_frequency:'购买频率',platform:'平台',shop:'店铺',original_price:'优惠前金额',discounts:'优惠明细',discount_rate:'折扣',spec_amount:'规格数量',spec_unit:'规格单位',purchase_unit_price:'购入单价',is_fuel:'加油记录',repurchase:'回购意愿',quality_score:'质量评分',experience_score:'体验评分',value_score:'性价比评分',refund:'已到账商品退款（累计）',refund_status:'退款状态',expected_refund:'预计还会退回',return_status:'退货状态',return_shipping_fee:'退货运费',return_shipping_reimbursement:'运费报销',return_insurance_fee:'运费险',note:'备注',image:'图片',legacy:'旧版附加信息',deleted_at:'删除状态'};
function importValue(key,value){
 if(key==='deleted_at')return value?'已删除（不计入统计）':'保留（计入统计）';
 if(value==null||value==='')return '未填写';
 if(key==='scene')return esc(SCENE_MAP[value]?.label||value);
 if(key==='necessity')return esc(NEC_MAP[value]?.label||value);
 if(key==='purchase_frequency')return esc(value?PURCHASE_FREQUENCY_MAP[value]?.label||value:'未填写');
 if(key==='return_status')return esc(RETURN_STATUS_MAP[value]||value);
 if(key==='refund_status')return esc(REFUND_STATUS_MAP[value]||value);
 if(key==='repurchase')return esc(({yes:'会回购',maybe:'再考虑',no:'不再买'})[value]||value);
 if(['price','original_price','refund','expected_refund','purchase_unit_price','return_shipping_fee','return_shipping_reimbursement','return_insurance_fee'].includes(key))return money(value);
 if(key==='image'&&typeof value==='string'&&/^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(value))return `<img src="${esc(value)}" alt="这份记录保存的图片">`;
 if(typeof value==='boolean')return value?'是':'否';
 const text=typeof value==='object'?JSON.stringify(value,null,2):String(value);
 return text.length>240?`<details><summary>展开查看内容</summary>${esc(text)}</details>`:esc(text);
}
function importDiffHTML(local,incoming){
 const a=recordContent(local),b=recordContent(incoming),keys=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>JSON.stringify(stableValue(a[k]))!==JSON.stringify(stableValue(b[k])));
 return keys.map(k=>`<section class="import-diff"><h3>${esc(IMPORT_LABELS[k]||k)}</h3><div class="import-values"><div><small>当前账本</small>${importValue(k,a[k])}</div><div><small>导入文件</small>${importValue(k,b[k])}</div></div></section>`).join('');
}
function cancelImport(){if(importPending?.saving)return;importPending=null;$('#editor-dialog').close();toast('已取消，本次导入没有改动账本')}
function bindImportDialog(){
 const d=$('#editor-dialog');d.oncancel=e=>{e.preventDefault();cancelImport()};$('#import-close').onclick=cancelImport;
 if($('#import-cancel'))$('#import-cancel').onclick=cancelImport;
 if(!d.open)d.showModal();const body=$('.dialog-body',d);if(body)body.scrollTop=0;
}
function showImportStep(){
 const p=importPending;if(!p)return;
 const d=$('#editor-dialog');
 if(p.index<p.conflicts.length){
  const c=p.conflicts[p.index],last=p.index===p.conflicts.length-1;
  d.innerHTML=`<div class="dialog-head"><h2>这笔用哪份？</h2><button class="icon-btn" id="import-close" aria-label="取消导入">×</button></div><div class="dialog-body"><p class="import-progress">第 ${p.index+1} / ${p.conflicts.length} 笔需要选择 · ${p.same.length} 笔相同，自动跳过</p><p class="import-intro"><b>${esc(c.local.name)}</b> · ${esc(c.local.purchase_date)}</p>${!!c.local.deleted_at!==!!c.incoming.deleted_at?'<p class="warning">一份已删除，一份仍保留。请明确选择，旧备份不会自动恢复已删账目。</p>':''}<div class="import-diffs">${importDiffHTML(c.local,c.incoming)}</div><p class="muted">选择会保留该版本的完整记录（含图片和附加信息）。另有 ${p.added.length} 条新增；${last?'选完本笔即完成导入':'全部选完再统一保存'}，中途取消不改原账本。</p><p id="import-error" class="error" role="alert"></p></div><div class="dialog-foot import-choice-foot"><button class="btn import-cancel" id="import-cancel">取消导入</button><button class="btn" id="import-keep">用当前账本</button><button class="btn primary" id="import-incoming">用导入文件</button></div>`;
  const choose=async incoming=>{if(p.saving||p!==importPending)return;p.choices.set(c.local.id,incoming);p.index++;if(p.index<p.conflicts.length)showImportStep();else await finishImport()};
  $('#import-keep').onclick=()=>choose(false);$('#import-incoming').onclick=()=>choose(true);
 }else{
  d.innerHTML=`<div class="dialog-head"><h2>导入预览</h2><button class="icon-btn" id="import-close" aria-label="取消导入">×</button></div><div class="dialog-body"><p>新增 ${p.added.length} 条 · 相同 ${p.same.length} 条自动跳过${p.addVehicle?' · 保留车辆资料':''}</p><ul class="import-preview-list">${p.added.slice(0,10).map(r=>`<li>${esc(r.name)} · ${money(r.price)}${r.deleted_at?' · 已删除':''}</li>`).join('')}</ul><p class="muted">只合并，不清空当前账本。图片、规格、退款和旧版附加信息继续保留。</p><p id="import-error" class="error" role="alert"></p></div><div class="dialog-foot"><button class="btn" id="import-cancel">取消</button><button class="btn primary" id="import-confirm">确认导入</button></div>`;
  $('#import-confirm').onclick=finishImport;
 }
 bindImportDialog();
}
async function finishImport(){
 const p=importPending;if(!p||p.saving)return;p.saving=true;
 const buttons=$$('button',$('#editor-dialog'));buttons.forEach(b=>b.disabled=true);
 try{
  const next=structuredClone(db),positions=new Map(next.records.map((r,i)=>[r.id,i])),dirty=new Set(Array.isArray(next.backup_dirty_ids)?next.backup_dirty_ids:[]);let replaced=0;
  for(const r of p.added){next.records.push(structuredClone(r));dirty.add(r.id)}
  for(const c of p.conflicts)if(p.choices.get(c.local.id)){next.records[positions.get(c.local.id)]=structuredClone(c.incoming);dirty.add(c.local.id);replaced++}
  if(p.addVehicle)next.vehicle=structuredClone(p.incoming.vehicle);
  next.backup_dirty_ids=[...dirty];
  if(p.added.length||replaced||p.addVehicle)await commitDB(next);
  importPending=null;$('#editor-dialog').close();render();toast(`导入完成：新增 ${p.added.length} 条，更新 ${replaced} 条，相同跳过 ${p.same.length} 条`);
 }catch(e){
  $('#import-error').textContent=e.message+'；可重试，或取消导入。';
 }finally{p.saving=false;buttons.forEach(b=>b.disabled=false)}
}
async function previewImport(file){
 if(!file||importReading||importPending)return;importReading=true;
 try{
  if(file.size>40*1024*1024)throw new Error('文件超过 40MB，请分批导入');
  const raw=JSON.parse(await file.text());if(!raw||![1,2,3].includes(raw.schema_version)||!Array.isArray(raw.records)||raw.records.length>20000)throw new Error('需要 V1 / V2 / V3 JSON 备份，最多 20000 条');
  const incoming=raw.schema_version===3?normalizeDB(raw):migrateBackup(raw),ids=new Set();
  for(const r of incoming.records){if(ids.has(r.id))throw new Error('备份包含重复记录 ID，请检查后再导入');ids.add(r.id)}
  const p=createImportPlan(db,incoming);
  if(db.records.length+p.added.length>20000)throw new Error('合并后超过 20000 条，请先备份归档');
  if(!p.added.length&&!p.conflicts.length&&!p.addVehicle){toast(p.same.length?`这 ${p.same.length} 笔已经在账本里，无需重复导入`:'文件中没有需要导入的记录');return}
  importPending=p;showImportStep();
 }catch(e){importPending=null;toast('导入失败：'+e.message)}finally{importReading=false;$('#import-file').value=''}
}
let booted=false;
async function boot(){try{await loadDB();await restoreSeededLedger();booted=true;window.booted=true;render();$('#top-add').onclick=()=>openEditor();$('#bottom-add').onclick=()=>openEditor();$$('[data-nav]').forEach(b=>b.onclick=e=>{e.preventDefault();nav(b.dataset.nav)});$('#import-file').onchange=e=>previewImport(e.target.files[0])}catch(e){$('#view').innerHTML=`<div class="card"><h2>云端数据读取失败</h2><p class="error">${esc(e.message)}</p><p>你的数据没有丢失。请确认：① Supabase 建表语句已执行 ② 网络正常 ③ 已登录正确账号。然后刷新页面重试。</p></div>`}}
boot();
